name: JCuki mobile build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_ios:
        description: Compile the iOS simulator app (requires a macOS runner)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # Keep a native compilation running when a newer commit is pushed.
  # Repeated runs of the same commit can still replace each other.
  group: jcuki-mobile-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  # Optional public API endpoint. This is configuration, never an authentication token.
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
  EXPO_PUBLIC_FUNCTION_REGION: ${{ vars.EXPO_PUBLIC_FUNCTION_REGION }}

jobs:
  checks:
    name: TypeScript, lint, and behavior tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  live-system:
    name: Live Supabase accounts, devices, groups, and pagination
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify public registration and independent sessions against the configured server
        run: node scripts/live-system-check.mjs

  android:
    name: Standalone Android 13+ preview APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: npm ci
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
      - name: Install the Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Generate native Android project from Expo config
        # Optional Firebase client config for native push. Never print it in logs.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          fi
          npx expo prebuild --platform android --no-install
      - name: Verify preview signing configuration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const gradle = fs.readFileSync('android/app/build.gradle', 'utf8');
          const release = gradle.split(/release\s*\{/)[1];
          if (!release?.includes('signingConfig signingConfigs.debug')) {
            throw new Error('Expected Expo preview debug-key signing. Configure production signing explicitly before changing this job.');
          }
          NODE
      - name: Build bundled, installable APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
      - name: Verify Android version and package signature
        run: |
          apk='android/app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          minimum="$(apkanalyzer manifest min-sdk "$apk")"
          test "$minimum" = '33'
          mkdir -p artifacts
          cp "$apk" artifacts/JCuki-Android13-preview.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JCuki-Android13-preview
          path: artifacts/JCuki-Android13-preview.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build result
        run: |
          printf '%s\n' '### JCuki Android preview' 'Download the APK from this run’s Artifacts section and install it on Android 13 or later.' 'This standalone preview uses the Expo template debug signing key and includes its JavaScript bundle. Metro is not required.' 'Use a private production signing key or EAS production profile before publishing to Google Play.' >> "$GITHUB_STEP_SUMMARY"

  android-native:
    name: Android ${{ matrix.api }} keyboard, account, and avatar checks
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: JCuki-Android13-preview
          path: artifacts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run the exact release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb install -r artifacts/JCuki-Android13-preview.apk
            ANDROID_API_LEVEL=${{ matrix.api }} python scripts/native-smoke.py
      - name: Upload numeric input and keyboard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JCuki-native-android-${{ matrix.api }}
          path: native-results/
          if-no-files-found: ignore
          retention-days: 7

  publish-preview:
    name: Publish direct APK download
    if: github.ref == 'refs/heads/main'
    needs: [android, android-native, live-system, ios-simulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: jcuki-preview-publication
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JCuki-Android13-preview
          path: artifacts
      - name: Publish the current main build as a preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            printf '%s\n' 'A newer main commit exists; keeping its download as the next release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > /tmp/jcuki-release-notes.md <<'NOTES'
          Android 13+ standalone preview of JCuki 1.6.1, with the JavaScript bundle included.

          Empty password inputs stay visible when Next changes focus, before the first typed character. API and private photo requests execute in Tokyo beside the database. Controlled profile/group reads improved from 2.5–3.6 seconds to 0.44–0.53 seconds in the regional benchmark; actual network latency varies.

          Guided group setup, compact invitations, explicit unsaved profile/photo status with upload retry, and refresh that retains loaded agenda/history pages. Live Supabase system checks gate publication. Keyboard-aware Android/iPhone forms, authenticated avatar loading with persistent account-scoped cache, clearer full-page create/join group flow and real cloud sync status. Direct account registration without verification emails and Supabase Auth login across devices. Liquid glass surfaces and floating animated navigation with Light/Dark/System themes. Gallery profiles, weekly calendars, paginated plans/activity, Indonesian/English, and timezone-aware reminders.

          Install the attached APK directly; Expo Go and Metro are not needed. This preview uses the Expo template debug signing key. Use EAS/private production signing before store distribution. Shared schedules now use the configured Supabase server. Includes automatic device time zones, exit demo, copyable invitation codes/links, calendar formatter caching and themed navigation backgrounds. Background activity push additionally needs the EAS/Firebase/APNs setup described in docs/NOTIFICATIONS.md. Physical iPhone builds require Apple signing and are separate from this APK.
          NOTES
          tag="v1.6.1-preview-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            printf '%s\n' 'This immutable preview release already exists.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" artifacts/JCuki-Android13-preview.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "JCuki 1.6.1 — Android preview ${GITHUB_RUN_NUMBER}" \
            --notes-file /tmp/jcuki-release-notes.md --latest
          printf '%s\n' "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/JCuki-Android13-preview.apk" >> "$GITHUB_STEP_SUMMARY"

  ios-simulator:
    name: iOS simulator compilation
    if: github.event_name == 'push' || inputs.build_ios
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Verify SDK 57 Xcode requirement
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -showsdks
      - run: npm ci
      - name: Generate native iOS project and widget extension
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Compile iOS simulator app without device signing
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild -quiet -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath work/ios-simulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Simulator validation result
        run: |
          printf '%s\n' '### JCuki iOS compilation' 'The application and widget extension compiled for iOS Simulator.' 'This job does not create an installable iPhone IPA. Physical iPhone distribution requires Apple signing through EAS or Xcode.' >> "$GITHUB_STEP_SUMMARY"
